  intent_profiles:
    - tag: llm-lang-rep
      description: LLM与人类语言表征相关论文
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: linguistic representation
          keyword_cn: 语言表征
          query: linguistic representation in LLM
        - keyword: semantic representation
          keyword_cn: 语义表征
          query: semantic representation learned by language models
        - keyword: language encoding
          keyword_cn: 语言编码
          query: language encoding mechanisms in LLMs
        - keyword: interpretability of LLMs
          keyword_cn: LLM可解释性
          query: interpretability of large language models for language representation
      intent_queries:
        - query: How do large language models represent human language?
          query_cn: 大型语言模型如何表征人类语言？
          enabled: true
          source: manual
          note: ''
        - query: Neural representation of linguistic structure in transformers
          query_cn: Transformer中语言结构的神经表征
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-06-01T08:22:22.640Z'
