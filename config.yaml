          keyword_cn: 语言学理论
          query: linguistic theory large language model
        - keyword: syntax semantics
          keyword_cn: 句法语义
          query: syntax semantics large language model
        - keyword: cognitive linguistics
          keyword_cn: 认知语言学
          query: cognitive linguistics large language model
      intent_queries:
        - query: intersection of large language models and linguistic theory
          query_cn: 大型语言模型与语言学理论的交叉
          enabled: true
          source: manual
          note: ''
        - query: how large language models handle syntax and semantics
          query_cn: 大型语言模型如何处理句法和语义
          enabled: true
          source: manual
          note: ''
        - query: large language models in computational linguistics
          query_cn: 大型语言模型在计算语言学中的应用
