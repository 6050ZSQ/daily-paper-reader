          query: LLM benchmark tasks for language proficiency
      intent_queries:
        - query: How to evaluate language comprehension ability in large language models
          query_cn: 如何评估大语言模型的语言理解能力
          enabled: true
          source: manual
          note: ''
        - query: Benchmarks for assessing language generation in LLMs
          query_cn: 评估大语言模型语言生成的基准
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-06-01T08:25:36.654Z'
    - tag: llm-ling
