      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: large language model evaluation
          keyword_cn: 大语言模型评测
          query: large language model evaluation benchmarks and methods
        - keyword: natural language understanding evaluation
          keyword_cn: 自然语言理解评测
          query: natural language understanding evaluation metrics for LLMs
        - keyword: natural language generation evaluation
          keyword_cn: 自然语言生成评测
          query: natural language generation evaluation for large language models
        - keyword: LLM benchmark tasks
